apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-openstack-vm
  title: Create OpenStack Virtual Machine
  description: Provision an Ubuntu VM on OpenStack using Crossplane
  tags:
    - openstack
    - crossplane
    - infrastructure
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Provide VM Details
      required:
        - instanceName
        - flavorName
      properties:
        instanceName:
          title: Instance Name
          type: string
          description: Unique name for your virtual machine
          ui:autofocus: true
          ui:options:
            help: Use lowercase letters and hyphens (e.g., dev-vm-01)
        flavorName:
          title: VM Flavor Size
          type: string
          default: m1.small
          enum:
            - m1.small
            - m1.medium
            - m1.large

  steps:
    - id: generate-crossplane-claim
      name: Generate Crossplane OpenStack Instance Claim
      action: publish:file
      input:
        repoUrl: github.com?repo=devportal-labs/infra-manifests
        filePath: manifests/vm-${{ parameters.instanceName }}.yaml
        fileContent: |
          apiVersion: compute.idp.io/v1alpha1
          kind: OpenStackInstance
          metadata:
            name: ${{ parameters.instanceName }}
            namespace: default
          spec:
            parameters:
              instanceName: "${{ parameters.instanceName }}"
              flavorName: "${{ parameters.flavorName }}"

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        catalogInfoUrl: https://github.com/devportal-labs/infra-manifests/blob/main/manifests/vm-${{ parameters.instanceName }}.yaml

  output:
    links:
      - title: View Manifest in GitHub
        url: ${{ steps.generate-crossplane-claim.output.remoteUrl }}
